<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语作文智能批改报告</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(160deg, #eef2ff 0%, #f8fafc 40%, #eef2ff 100%);
  min-height: 100vh; color: #1e293b; padding: 24px 12px 60px;
}
.wrap { max-width: 760px; margin: 0 auto; }
.brand { text-align:center; margin-bottom: 20px; }
.brand a { color:#6366f1; text-decoration:none; font-weight:600; font-size:.9rem; }
.card {
  background:#fff; border-radius:16px; box-shadow:0 4px 24px rgba(99,102,241,.10);
  padding: 32px 28px; overflow:hidden;
}
@media (max-width:600px){ .card{ padding:22px 16px; } body{ padding:14px 8px 40px; } }
.loading { text-align:center; padding:60px 20px; color:#64748b; }
.loading .spin { font-size:2.4rem; animation:spin 1.2s linear infinite; display:inline-block; margin-bottom:14px; }
@keyframes spin{ to{ transform:rotate(360deg);} }
.err { color:#dc2626; background:#fef2f2; border:1px solid #fecaca; padding:14px 18px; border-radius:10px; }

.rep-head h1 { font-size:1.5rem; color:#1e293b; text-align:center; }
.rep-meta { text-align:center; color:#64748b; font-size:.88rem; margin-top:8px; padding-bottom:14px; border-bottom:2px solid #6366f1; }
.rep-prompt { background:#f8fafc; border-left:3px solid #c7d2fe; padding:12px 16px; border-radius:0 10px 10px 0; font-size:.85rem; color:#475569; margin:16px 0; line-height:1.6; }
.rep-total { text-align:center; margin: 18px 0 8px; }
.rep-total-num { font-size:3.4rem; font-weight:800; }
.rep-total-max { font-size:1.2rem; color:#94a3b8; margin-left:4px; }
.rep-level { display:inline-block; margin-left:14px; padding:4px 14px; border:1.5px solid; border-radius:20px; font-size:.9rem; font-weight:600; vertical-align:14px; }
.rep-dims { margin:20px 0; }
.rep-dim { margin-bottom:14px; }
.rep-dim-h { display:flex; justify-content:space-between; font-size:.92rem; font-weight:600; color:#334155; margin-bottom:5px; }
.rep-bar { height:8px; background:#eef2f7; border-radius:4px; overflow:hidden; }
.rep-bar-fill { height:100%; border-radius:4px; transition:width .6s ease; }
.rep-dim-c { font-size:.82rem; color:#64748b; margin-top:4px; line-height:1.5; }
.rep-section { margin-top:22px; }
.rep-section h3 { font-size:1.02rem; color:#1e293b; margin-bottom:10px; padding-left:10px; border-left:4px solid #6366f1; }
.rep-section p, .rep-section li { font-size:.92rem; color:#334155; line-height:1.7; }
.rep-section ul, .rep-section ol { padding-left:22px; }
.rep-section li { margin-bottom:6px; }
.rep-corr { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px 16px; margin-bottom:10px; }
.rep-tag { display:inline-block; background:#eef2ff; color:#6366f1; font-size:.75rem; font-weight:600; padding:2px 10px; border-radius:10px; margin-bottom:8px; }
.rep-corr-line { font-size:.9rem; line-height:1.6; }
.rep-corr-line b { font-size:.78rem; padding:1px 8px; border-radius:6px; margin-right:8px; }
.rep-corr-line.bad b { background:#fef2f2; color:#dc2626; }
.rep-corr-line.good b { background:#ecfdf5; color:#059669; }
.rep-corr-exp { font-size:.82rem; color:#64748b; margin-top:6px; }
.rep-essay { background:#f8fafc; border-radius:10px; padding:16px 20px; }
.rep-essay-p { font-family: Georgia, "Times New Roman", serif; font-size:.98rem; line-height:1.9; color:#1e293b; margin-bottom:8px; }
.rep-footer { text-align:center; color:#94a3b8; font-size:.78rem; margin-top:28px; padding-top:14px; border-top:1px dashed #e2e8f0; }

.actions { display:flex; gap:12px; justify-content:center; margin-top:20px; flex-wrap:wrap; }
.actions button {
  border:none; border-radius:10px; padding:12px 26px; font-size:.95rem; font-weight:600;
  cursor:pointer; transition:all .2s;
}
.btn-print { background:#6366f1; color:#fff; }
.btn-print:hover { background:#4f46e5; }
.btn-word { background:#10b981; color:#fff; }
.btn-word:hover { background:#059669; }
.btn-copy { background:#fff; color:#6366f1; border:1.5px solid #6366f1 !important; }
.btn-copy:hover { background:#eef2ff; }
@media print {
  .actions, .brand { display:none !important; }
  body { background:#fff; padding:0; }
  .card { box-shadow:none; border-radius:0; padding:0; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><a href="index.html">← 英语自主研学平台</a></div>
  <div class="card">
    <div class="loading" id="shareLoading">
      <span class="spin">⏳</span>
      <p>正在加载报告...</p>
    </div>
    <div id="shareReport"></div>
    <div class="actions hidden" id="shareActions" style="display:none;">
      <button class="btn-print" onclick="window.print()">🖨️ 打印 / 保存 PDF</button>
      <button class="btn-word" onclick="EssayReport.downloadDocx()">📄 下载 Word</button>
      <button class="btn-copy" onclick="copyLink()">📋 复制链接</button>
    </div>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/report.js?v=2"></script>
<script>
loadSharedEssayReport().then(function (data) {
    renderEssayReportPage(data);
    if (data) {
        document.getElementById('shareActions').style.display = 'flex';
    }
});
function copyLink() {
    var link = location.href;
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(function () { alert('✅ 链接已复制'); });
    } else {
        prompt('复制以下链接：', link);
    }
}
</script>
</body>
</html>
